<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CardioGlyc AI — Architecture Diagram (Happiest Health Summit 2026)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @media print {
      body { background: #030712 !important; color: #f1f5f9 !important; -webkit-print-color-adjust: exact; }
      .no-print { display: none !important; }
      svg { width: 100vw !important; height: auto !important; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between p-6">
  <!-- Top bar -->
  <header class="no-print border-b border-slate-800 pb-4 mb-4 flex items-center justify-between">
    <div>
      <h1 class="text-lg font-bold text-cyan-300">System Architecture Diagram</h1>
      <p class="text-xs text-slate-400">Happiest Health Digital Twin Challenge 2026</p>
    </div>
    <div class="flex items-center gap-3">
      <a href="architecture_diagram.svg" download="architecture_diagram.svg" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs rounded-lg border border-slate-700 transition-colors">
        ⬇ Download SVG
      </a>
      <button onclick="window.print()" class="px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-semibold rounded-lg shadow-sm transition-colors">
        📄 Save as PDF
      </button>
    </div>
  </header>

  <!-- SVG Container -->
  <main class="flex-1 flex items-center justify-center">
    <object data="architecture_diagram.svg" type="image/svg+xml" class="w-full max-w-6xl shadow-2xl rounded-2xl border border-slate-800"></object>
  </main>

  <footer class="no-print pt-4 text-center text-xs text-slate-500">
    Tip: Press <strong>Ctrl+P (Cmd+P)</strong> and choose <strong>"Save as PDF"</strong> in Landscape mode for submission.
  </footer>
</body>
</html>
